[tank_real]
# < Tank operating temperature bounds >
# temp_min_heat and temp_max_cool are optional (defaulting to t_amb) but will impact discharging thermal power limits if
# scalar values are given rather than coefficient arrays, causing linear fits to have an x-intercept of zero
temp_max_heat = 55
#temp_min_heat =
#temp_max_cool =
temp_min_cool = 2

# < Pumping power of tank discharging >
# pd_max_rn or pd_max_dc may be set to 0 if discharging is not possible
pd_max_rn = 0.200
pd_max_dc = 0.370

# < Discharging thermal power limits >
# Coefficient arrays may be given for linear polynomial fits of qd with respect to x (stored tank energy) if avaiable,
# conversely, scalar values can be given representing qd_max at x_max, qd_min at x_min and fits will be calculated
# automatically
# All parameters are optional and will default to 0, but one or more values must be nonzero to enable tank discharging
# behavior
qd_max_rn = 11.84
qd_min_rn = -7.64
qd_max_dc = 11.84
qd_min_dc = -7.64

# < Tank Parameters >
# Tank parameters are technically all optional, but one of the below methods must be chosen to calculate fundemental
# parameters r_tank and c_tank
# r_tank:
#   1.) Specify directly
#   2.) Use k_ins, l_ins, h_tank, and v_tank
#   3.) Use q_loss
# c_tank:
#   1.) Specify directly
#   2.) Use v_tank, n_tanks, and thermophysical properties of fluid (dependent on p_tank, temp_max_heat, temp_min_cool)
#   3.) Same as 2.) but use h_tank and d_tank instead of v_tank
# temp_ref_q_loss defaults to temp_max_heat or temp_min_cool depending on sign of q_loss, temp_amb defaults to 21 degC,
# p_tank defaults to 1013.25 kPa, fluid defaults to "Water"
n_tanks = 3
#h_tank =
#d_tank =
#v_tank =
#p_tank =
q_loss = 0.09167
#temp_ref_q_loss =
#temp_amb =
#k_ins =
#l_ins =
#fluid =
#r_tank =
c_tank = 5123

